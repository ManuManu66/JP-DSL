<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>John Papa's Pizzeria DSL - IDE</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1>John Papa's Pizzeria</h1>
    <nav>
      <a href="{{ url_for('index') }}">Orders</a>
      <a href="{{ url_for('catalog_view') }}">Catalog (Domain Expert)</a>
    </nav>
  </header>

  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <ul class="flashes">
          {% for category, message in messages %}
            <li class="flash flash-{{ category }}">{{ message }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
